  <script>
    (function () {
      const g = document.getElementById('g');
      const seen = new Set();
      function add(id, crumb) {
        const v = VISUALS[id];
        if (!v) return;
        seen.add(id);
        const sec = document.createElement('section');
        sec.innerHTML = '<div class="crumb" style="margin-top:26px">' + crumb + '</div>' +
          '<div class="diagram hero"><div class="dg-title">📊 ' + v.t + '</div>' + v.html + '</div>';
        g.appendChild(sec);
      }
      SD.tracks.forEach(track => {
        const h = document.createElement('h2');
        h.style.marginTop = '40px';
        h.textContent = track.icon + ' ' + track.name;
        g.appendChild(h);
        SD.levelsOf(track).forEach(level => add(level.id, level.id + ' — ' + level.title));
      });
      const rest = Object.keys(VISUALS).filter(id => !seen.has(id));
      if (rest.length) {
        const h = document.createElement('h2');
        h.style.marginTop = '40px';
        h.textContent = 'Bina level ke diagrams';
        g.appendChild(h);
        rest.forEach(id => add(id, id));
      }
    })();
