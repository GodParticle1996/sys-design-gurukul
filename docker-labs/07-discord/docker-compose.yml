# docker compose --profile ex1-partition-key up --build
services:
  store:
    build: .
    profiles: ["ex1-partition-key"]
    command: node services/store.js
    environment: { PORT: "4701", KEY: "${KEY:-channel}", BUCKETS: "${BUCKETS:-4}" }
    ports: ["4701:4701"]
  partition:
    build: .
    profiles: ["ex2-coalescing"]
    command: node services/partition.js
    environment: { PORT: "4714" }
    ports: ["4714:4714"]
  ds-1: { build: ., profiles: ["ex2-coalescing"], command: node services/data-service.js, environment: { PORT: "4711", COALESCE: "${COALESCE:-0}", PART_PORT: "4714" }, ports: ["4711:4711"] }
  ds-2: { build: ., profiles: ["ex2-coalescing"], command: node services/data-service.js, environment: { PORT: "4712", COALESCE: "${COALESCE:-0}", PART_PORT: "4714" }, ports: ["4712:4712"] }
  ds-3: { build: ., profiles: ["ex2-coalescing"], command: node services/data-service.js, environment: { PORT: "4713", COALESCE: "${COALESCE:-0}", PART_PORT: "4714" }, ports: ["4713:4713"] }
  old-store:
    build: .
    profiles: ["ex3-live-migration"]
    command: node services/msg-store.js
    environment: { PORT: "4721", NAME: "old-store", SEED: "400000", NEW_PORT: "4722" }
    ports: ["4721:4721"]
  new-store:
    build: .
    profiles: ["ex3-live-migration"]
    command: node services/msg-store.js
    environment: { PORT: "4722", NAME: "new-store" }
    ports: ["4722:4722"]
  writer:
    build: .
    profiles: ["ex3-live-migration"]
    command: node services/writer.js
    environment: { RATE: "500", OLD_PORT: "4721" }
